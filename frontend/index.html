<!DOCTYPE html>
<html>
<head>
  <title>YT Downloader</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex items-center justify-center">

<div class="w-full max-w-xl p-8 bg-zinc-900 rounded-2xl">

  <h1 class="text-3xl font-bold mb-6">
    YouTube Downloader
  </h1>

  <input
    id="url"
    type="text"
    placeholder="Paste YouTube URL"
    class="w-full p-4 rounded bg-zinc-800 mb-4"
  />

  <select id="format" class="w-full p-4 rounded bg-zinc-800 mb-4">
    <option value="mp4">MP4</option>
    <option value="webm">WEBM</option>
  </select>

  <button
    onclick="downloadVideo()"
    class="w-full bg-white text-black p-4 rounded font-bold"
  >
    Download
  </button>

  <div id="result" class="mt-6"></div>

</div>

<script>

async function downloadVideo() {

    const url = document.getElementById("url").value
    const format = document.getElementById("format").value

    const response = await fetch("http://localhost:8000/download", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            url,
            format_type: format
        })
    })

    const data = await response.json()

    document.getElementById("result").innerHTML = `
        <a
          href="http://localhost:8000${data.download_url}"
          class="text-green-400 underline"
        >
          Download ${data.title}
        </a>
    `
}

</script>

</body>
</html>
